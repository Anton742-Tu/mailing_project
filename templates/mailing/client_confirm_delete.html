{% extends 'base.html' %}

{% block title %}Удаление клиента{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">Подтверждение удаления</h4>
            </div>
            <div class="card-body text-center">
                <div class="alert alert-warning">
                    <h5>Внимание!</h5>
                    <p>Вы уверены, что хотите удалить клиента <strong>"{{ client.full_name }}"</strong>?</p>
                    <p class="mb-0">Email: {{ client.email }}</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'client_list' %}" class="btn btn-secondary">Отмена</a>
                        <button type="submit" class="btn btn-danger">Удалить клиента</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
