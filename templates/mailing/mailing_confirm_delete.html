{% extends 'base.html' %}

{% block title %}Удаление рассылки - Система рассылок{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0 text-danger">
                    <i class="bi bi-exclamation-triangle"></i> Удаление рассылки
                </h4>
            </div>
            <div class="card-body">
                <p>Вы уверены, что хотите удалить рассылку <strong>"{{ mailing.title }}"</strong>?</p>
                <p class="text-muted">Это действие нельзя будет отменить.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'mailing_list' %}" class="btn btn-secondary">Отмена</a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Удалить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
